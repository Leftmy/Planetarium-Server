openapi: 3.0.3

info:
  title: Planetarium API
  version: "1.0.0"
  description: |
    Authentication for the Planetarium platform.

    Written by hand rather than generated from annotations: the contract is
    agreed first (see `docs/api-contract-draft.md`) and the code follows it, so
    the spec is the source and not a report on what the handlers happen to do.

    **Session model.** The access token is a short-lived JWT, sent as
    `Authorization: Bearer <token>`. The refresh token is a long-lived random
    string stored hashed in the database, which is what makes it revocable.
    Exchanging a refresh token rotates it: the old one dies and a new one is
    issued. Presenting an already exchanged token is treated as theft and
    revokes every live session of that user.

servers:
  - url: http://localhost:8080
    description: Local docker compose

tags:
  - name: auth
    description: Registration and sessions

paths:
  /api/v1/register:
    post:
      tags: [auth]
      summary: Create an account
      description: |
        Creates the user and its local sign-in method in one transaction.
        Returns no tokens — the client follows up with `/api/v1/login`.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                summary: A valid registration
                value:
                  name: Grace Hopper
                  email: grace@example.com
                  password: correct horse battery
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          description: |
            Invalid body, email, password or display name.
            Codes: `invalid_request`, `invalid_email`, `password_too_weak`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The email address is already registered (`email_already_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/login:
    post:
      tags: [auth]
      summary: Exchange an email and password for a token pair
      description: |
        An unknown address, a wrong password and an account that has no password
        because it was created through OAuth all answer identically. Anything
        else would turn this endpoint into a way of checking who is registered.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: grace@example.com
                  password: correct horse battery
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The body could not be parsed (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong credentials (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new pair
      description: |
        The presented token is revoked and replaced. Sending it a second time
        means a copy of it exists somewhere it should not, so the response is a
        401 **and** every live session of that user is revoked — including the
        one issued by the successful exchange a moment earlier.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair; the old refresh token is now dead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: The body could not be parsed (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            The token is unknown, expired or already used
            (`invalid_refresh_token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    InternalError:
      description: Something went wrong (`internal_error`). Details go to the log, not the response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Not required by any endpoint yet — no protected routes exist. Declared
        because the access token these endpoints hand out is meant to be used
        this way.

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Grace Hopper
        email:
          type: string
          format: email
          description: Case-insensitive; stored lowercased.
          example: grace@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Between 8 and 72 bytes. Hashed with argon2id; never stored as given.
          example: correct horse battery

    RegisteredUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7, so identifiers sort by creation time.
          example: 019fca5e-9309-7c64-90ff-a7c869e8acae
        email:
          type: string
          format: email
          example: grace@example.com
        name:
          type: string
          example: Grace Hopper

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: grace@example.com
        password:
          type: string
          format: password
          example: correct horse battery

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: The value returned by /login or a previous /refresh.
          example: kj8oaBe8f4O9EAcZ1nQ7xWv2tYb5mL0pRs9dGh3jKfE

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT (HS256) with `sub`, `iat`, `exp` and a unique `jti`.
        refresh_token:
          type: string
          description: |
            Opaque random string. The server keeps only its hash, so this is the
            only copy — a client that loses it has to log in again.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds left on the access token, so a client need not decode the JWT.
          example: 899
        user:
          $ref: '#/components/schemas/RegisteredUser'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable identifier. Branch on this, not on the
                message or the status code.
              enum:
                - invalid_request
                - invalid_email
                - password_too_weak
                - invalid_credentials
                - invalid_refresh_token
                - email_already_exists
                - not_found
                - unauthorized
                - internal_error
              example: invalid_credentials
            message:
              type: string
              description: |
                English, aimed at developers and logs. Not for showing to users —
                localise on the client, keyed by `code`.
              example: Invalid email or password
